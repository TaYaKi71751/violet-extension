<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Violet Deeplink Opener</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #18171f;
      --panel: #23202d;
      --panel-strong: #2f2a3d;
      --text: #f7f3ff;
      --muted: #b9b1c9;
      --accent: #9d7cff;
      --accent-strong: #b39aff;
      --ring: rgba(157, 124, 255, 0.42);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 460px;
      margin: 0;
      padding: 18px;
      background:
        linear-gradient(145deg, rgba(157, 124, 255, 0.18), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 750;
      line-height: 1.2;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    input,
    button {
      display: block;
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
    }

    input {
      min-height: 44px;
      margin-bottom: 12px;
      padding: 10px 12px;
      overflow: hidden;
      border-color: var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      text-overflow: ellipsis;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    input::placeholder {
      color: rgba(185, 177, 201, 0.72);
    }

    input:focus {
      border-color: var(--accent);
      background: var(--panel-strong);
      box-shadow: 0 0 0 4px var(--ring);
    }

    button {
      min-height: 42px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--accent), #7557df);
      color: white;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      filter: brightness(1.07);
      box-shadow: 0 10px 24px rgba(117, 87, 223, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Violet Extension</h1>
  <label for="url">Page URL</label>
  <input id="url" type="text" placeholder="https://hitomi.la/..." />
  <button id="open">Open in Violet</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
